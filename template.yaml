AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Incident Triage Assistant - automated outage diagnosis and remediation
  (alert ingestion -> log/config correlation -> RAG -> Bedrock RCA -> runbook
  -> gated remediation), multi-tenant. Every physical name is derived from the
  NamePrefix parameter, so deploys stay idempotent to the same fixed set of
  resources.

Parameters:
  # Every physical resource name in this stack is built from this one value.
  # Fixed to the platform contract's prefix -- resources named outside it are
  # never cleaned up -- so redeploys are idempotent to the same stack instead
  # of minting a new set of names each time. deploy.sh and destroy.sh pass it
  # in from their shared PREFIX.
  NamePrefix:
    Type: String
    Default: app-b9dac5ac-bc8fbf47
    AllowedPattern: '^app-b9dac5ac-bc8fbf47$'
    ConstraintDescription: >
      must be exactly the contract prefix, app-b9dac5ac-bc8fbf47

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        # The handlers build their own SSM parameter names
        # (/{PREFIX}/tenant/{id}/dek and friends); this is how they land on the
        # same path the IAM policies below authorise.
        NAME_PREFIX: !Ref NamePrefix
        TENANTS_TABLE: !Ref TenantsTable
        ALERTS_TABLE: !Ref AlertsTable
        DIAGNOSTICS_TABLE: !Ref DiagnosticsTable
        RUNBOOKS_TABLE: !Ref RunbooksTable
        AUDIT_TABLE: !Ref AuditTrailTable
        CONTEXT_CACHE_BUCKET: !Ref ContextCacheBucket
        RUNBOOKS_BUCKET: !Ref RunbooksBucket
        VECTOR_BUCKET: !Sub '${NamePrefix}-vectors'
        VECTOR_INDEX: incidents
        RUNBOOK_READY_TOPIC_ARN: !Ref RunbookReadyTopic
        OPS_ALARMS_TOPIC_ARN: !Ref OpsAlarmsTopic
        TENANT_SCOPED_ROLE_ARN: !GetAtt TenantScopedRole.Arn

Resources:

  # ---------------------------------------------------------------------
  # Shared Lambda layer (common/ helper modules + boto3/cryptography)
  # ---------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${NamePrefix}-layer-common'
      # src/layer/python/, NOT src/layer/. With a BuildMethod set, SAM treats
      # ContentUri as the build source and adds the layer's own `python/` prefix
      # itself -- so pointing at src/layer/ nested the repo's python/ directory
      # inside SAM's, producing /opt/python/python/common/. Only /opt/python is on
      # PYTHONPATH, so every function failed at import with "No module named
      # 'common'" (and the custom resource with "No module named 'cfnresponse'"),
      # after a build and a deploy that both reported success. requirements.txt
      # lives in the same directory because SAM looks for the manifest inside
      # ContentUri.
      ContentUri: src/layer/python/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  # ---------------------------------------------------------------------
  # DynamoDB tables
  # ---------------------------------------------------------------------
  TenantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${NamePrefix}-tenants'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  AlertsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${NamePrefix}-alerts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: received_at
          AttributeType: N
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # The base sort key is alert#{alert_id}, which deduplicates correctly but
        # orders lexicographically by id. The incident rail needs newest-first, so
        # chronological ordering comes from here instead.
        - IndexName: received-at-index
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: received_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  DiagnosticsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${NamePrefix}-diagnostics'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  RunbooksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${NamePrefix}-runbooks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  AuditTrailTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${NamePrefix}-audit-trail'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # S3 buckets (tenant-prefixed objects, default SSE-S3 encryption)
  # ---------------------------------------------------------------------
  ContextCacheBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${NamePrefix}-context-cache-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-context-cache
            Status: Enabled
            ExpirationInDays: 30

  RunbooksBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${NamePrefix}-runbooks-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AuditExportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${NamePrefix}-audit-exports-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------
  # S3 Vectors bucket + index (created via custom resource; not yet a
  # native CloudFormation resource type)
  # ---------------------------------------------------------------------
  S3VectorsSetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-s3vectors-setup'
      LoggingConfig:
        LogGroup: !Ref S3VectorsSetupFunctionLogGroup
      CodeUri: src/handlers/
      Handler: s3vectors_setup.handler
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:CreateVectorBucket
                - s3vectors:GetVectorBucket
                - s3vectors:DeleteVectorBucket
                - s3vectors:CreateIndex
                - s3vectors:GetIndex
                - s3vectors:DeleteIndex
              Resource: '*'

  # S3 Vectors bucket/index creation can outlast CloudFormation's stack
  # operation timeout, so it is never invoked as a CFN custom resource.
  # Instead deploy.sh publishes to S3VectorsSetupTopic once the stack is
  # live, and S3VectorsAsyncSetupFunction runs the setup out-of-band.
  S3VectorsSetupTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${NamePrefix}-topic-s3vectors-setup'

  S3VectorsAsyncSetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-s3vectors-async-setup'
      CodeUri: src/handlers/
      Handler: s3vectors_async_setup.handler
      Timeout: 300
      Environment:
        Variables:
          S3VECTORS_SETUP_FUNCTION_NAME: !Ref S3VectorsSetupFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt S3VectorsSetupFunction.Arn
      Events:
        SetupTrigger:
          Type: SNS
          Properties:
            Topic: !Ref S3VectorsSetupTopic

  # ---------------------------------------------------------------------
  # SQS buffer queue + DLQ
  # ---------------------------------------------------------------------
  # Three queues, one job each. There used to be a "buffer" queue that nothing
  # consumed — so alerts accumulated in it and expired — sharing a DLQ with
  # pipeline failures, which made that DLQ unredrivable: the two message shapes
  # are completely different and a consumer could not tell them apart.

  # Alerts EventBridge could not hand to the state machine. This is what stops a
  # failed StartExecution from silently dropping an alert.
  AlertDispatchDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${NamePrefix}-queue-alert-dispatch-dlq'
      MessageRetentionPeriod: 1209600

  # Pipeline executions that failed part-way. Messages carry the full state so a
  # redrive can resume with the context already gathered.
  PipelineFailureDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${NamePrefix}-queue-pipeline-failure-dlq'
      MessageRetentionPeriod: 1209600

  # Audit records that could not be written. A trail described as append-only
  # cannot lose records to a failed asynchronous invoke.
  AuditWriteDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${NamePrefix}-queue-audit-write-dlq'
      MessageRetentionPeriod: 1209600

  # ---------------------------------------------------------------------
  # SNS topics
  # ---------------------------------------------------------------------
  RunbookReadyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${NamePrefix}-topic-runbook-ready'

  OpsAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${NamePrefix}-topic-ops-alarms'

  # ---------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    # Deleted with the stack: destroy.sh must leave nothing behind, and the
    # accounts in it are self-signup accounts for a prototype.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub '${NamePrefix}-cognito-userpool'
      MfaConfiguration: 'OFF'
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: tenant_id
          AttributeDataType: String
          # Mutable so the PostConfirmation trigger can set it; deliberately
          # absent from the app client's WriteAttributes so the user cannot.
          Mutable: true
          Required: false
      LambdaConfig:
        PostConfirmation: !GetAtt TenantProvisionFunction.Arn
        # Auto-confirms the account so signup is a single step, and refuses a
        # consumer email domain with a message the form can show. Without it such
        # a signup produced an account that could sign in and was then denied on
        # every request, because no tenant could be derived for it.
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${NamePrefix}-app-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # custom:tenant_id is deliberately NOT writable. With self-signup
      # enabled, a client-writable tenant attribute let anyone claim an existing
      # tenant's id at signup and then read that tenant's incidents.
      # fn-tenant-provision derives it from the verified email domain instead.
      WriteAttributes:
        - email

  TenantAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TenantAdmin
      UserPoolId: !Ref UserPool

  TenantEngineerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TenantEngineer
      UserPoolId: !Ref UserPool

  TenantLeadershipGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TenantLeadership
      UserPoolId: !Ref UserPool

  UserPoolInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantProvisionFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolPreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreSignUpFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------
  # Tenant-scoped data-plane role (assumed by pipeline/query Lambdas with
  # a tenant_id session tag; its own policy restricts DynamoDB LeadingKeys
  # and S3 key prefixes to that tag, enforcing IAM-level tenant isolation)
  # ---------------------------------------------------------------------
  TenantScopedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}-role-tenant-scoped'
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            # TagSession as well as AssumeRole: tenant_scope tags each session
            # with tenant_id, and passing session tags needs BOTH actions here
            # and in the caller's own policy. Granting only AssumeRole made
            # every data-plane call in the application fail with AccessDenied.
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${NamePrefix}-*
      Policies:
        - PolicyName: tenant-scoped-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TenantsTable.Arn
                  - !GetAtt AlertsTable.Arn
                  # The incident list is the one query that MUST use a GSI: the
                  # base sort key is alert#{alert_id}, so chronological order can
                  # only come from received-at-index. A Query on an index needs the
                  # index ARN, and without it the list failed with AccessDenied.
                  - !Sub ${AlertsTable.Arn}/index/*
                  - !GetAtt DiagnosticsTable.Arn
                  - !GetAtt RunbooksTable.Arn
                  - !Sub ${RunbooksTable.Arn}/index/*
                  - !GetAtt AuditTrailTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ${aws:PrincipalTag/tenant_id}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub ${ContextCacheBucket.Arn}/tenant/${!aws:PrincipalTag/tenant_id}/*
                  - !Sub ${RunbooksBucket.Arn}/tenant/${!aws:PrincipalTag/tenant_id}/*

  # The same tenant isolation as TenantScopedRole, minus every write.
  #
  # fn-chat assumes this one instead, because it is the only function whose
  # actions are chosen by a language model. Its tool list contains no mutation
  # and a test asserts that, but a tool list is application code: this makes the
  # credentials themselves incapable of a write, so a mutating tool added by
  # mistake fails with AccessDenied rather than succeeding. Everything else about
  # the isolation is identical -- dynamodb:LeadingKeys and the tenant/ object
  # prefix are still pinned to the session's tenant_id tag.
  TenantScopedReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}-role-tenant-read'
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${NamePrefix}-*
      Policies:
        - PolicyName: tenant-scoped-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TenantsTable.Arn
                  - !GetAtt AlertsTable.Arn
                  - !Sub ${AlertsTable.Arn}/index/*
                  - !GetAtt DiagnosticsTable.Arn
                  - !GetAtt RunbooksTable.Arn
                  - !Sub ${RunbooksTable.Arn}/index/*
                  - !GetAtt AuditTrailTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ${aws:PrincipalTag/tenant_id}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub ${ContextCacheBucket.Arn}/tenant/${!aws:PrincipalTag/tenant_id}/*
                  - !Sub ${RunbooksBucket.Arn}/tenant/${!aws:PrincipalTag/tenant_id}/*

  # ---------------------------------------------------------------------
  # Pipeline Lambda functions
  # ---------------------------------------------------------------------
  IngestNormalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-ingest-normalize'
      LoggingConfig:
        LogGroup: !Ref IngestNormalizeFunctionLogGroup
      CodeUri: src/handlers/
      Handler: ingest_normalize.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/ingest-hmac
      Events:
        PostAlert:
          Type: Api
          Properties:
            RestApiId: !Ref IngestionApi
            Path: /v1/alerts
            Method: post
            Auth:
              ApiKeyRequired: true

  CorrelateLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-correlate-logs'
      LoggingConfig:
        LogGroup: !Ref CorrelateLogsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: correlate.logs_handler
      Timeout: 90
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/integration-creds

  CorrelateConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-correlate-config'
      LoggingConfig:
        LogGroup: !Ref CorrelateConfigFunctionLogGroup
      CodeUri: src/handlers/
      Handler: correlate.config_handler
      Timeout: 90
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/integration-creds

  RagContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-rag-context'
      LoggingConfig:
        LogGroup: !Ref RagContextFunctionLogGroup
      CodeUri: src/handlers/
      Handler: rag_context.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/cohere.embed-multilingual-v3
            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:PutVectors
              Resource:
                - !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${NamePrefix}-vectors
                - !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${NamePrefix}-vectors/index/*

  GenerateRcaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-generate-rca'
      LoggingConfig:
        LogGroup: !Ref GenerateRcaFunctionLogGroup
      CodeUri: src/handlers/
      Handler: generate_rca.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/dek
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

  GenerateRunbookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-generate-runbook'
      LoggingConfig:
        LogGroup: !Ref GenerateRunbookFunctionLogGroup
      CodeUri: src/handlers/
      Handler: generate_runbook.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-notify'
      LoggingConfig:
        LogGroup: !Ref NotifyFunctionLogGroup
      CodeUri: src/handlers/
      Handler: notify.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref RunbookReadyTopic
            # notify.handler calls progress.mark_stage, which writes through the
            # tenant-scoped role. Without this the call failed on every
            # invocation -- and mark_stage swallows failures by design, so the
            # last stage of the pipeline simply never appeared in the timeline
            # and nothing anywhere said why.
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn

  # Nothing used to record that a diagnosis failed. The state machine sent the
  # failed state to a DLQ and published to the ops topic, but never touched the
  # alert row -- so the read API's "failed" state was unreachable and a failed
  # diagnosis showed as "diagnosing" indefinitely.
  MarkPipelineFailedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-mark-pipeline-failed'
      LoggingConfig:
        LogGroup: !Ref MarkPipelineFailedFunctionLogGroup
      CodeUri: src/handlers/
      Handler: notify.failure_handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn

  NotifyImsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-notify-ims'
      LoggingConfig:
        LogGroup: !Ref NotifyImsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: notify_ims.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/integration-creds

  AuditWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-audit-write'
      LoggingConfig:
        LogGroup: !Ref AuditWriteFunctionLogGroup
      CodeUri: src/handlers/
      Handler: audit_write.handler
      # record_audit invokes this asynchronously, so an exception here would
      # vanish after Lambda's internal retries with nowhere to land.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt AuditWriteDlq.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AuditWriteDlq.Arn

  # Runs before the account exists. Needs no AWS permissions at all: it reads the
  # event, refuses a consumer domain, and sets two flags on the response.
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-pre-signup'
      LoggingConfig:
        LogGroup: !Ref PreSignUpFunctionLogGroup
      CodeUri: src/handlers/
      Handler: pre_signup.handler

  # The authenticated way to raise an incident, for a person using the console.
  # The public webhook (fn-ingest-normalize) proves itself with an API key and an
  # HMAC over the body and only then trusts the tenant_id inside it; this one
  # takes the tenant from the authorizer context instead, so a signed-in user
  # cannot write an incident into somebody else's tenant.
  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-create-incident'
      LoggingConfig:
        LogGroup: !Ref CreateIncidentFunctionLogGroup
      CodeUri: src/handlers/
      Handler: create_incident.handler
      Environment:
        Variables:
          AUDIT_WRITE_FUNCTION_NAME: !Ref AuditWriteFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AuditWriteFunction.Arn
      Events:
        CreateIncident:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/alerts
            Method: post

  # The tenant's roster and role changes. Reads member rows from the Tenants
  # table rather than Cognito, because ListUsers cannot filter on a custom
  # attribute like custom:tenant_id -- finding one tenant's users through Cognito
  # would mean paging the entire pool.
  TeamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-team'
      LoggingConfig:
        LogGroup: !Ref TeamFunctionLogGroup
      CodeUri: src/handlers/
      Handler: team.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          AUDIT_WRITE_FUNCTION_NAME: !Ref AuditWriteFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            # Scoped to this pool by ARN. Unlike fn-tenant-provision and
            # fn-pre-signup, this function is not one of the pool's triggers, so
            # a GetAtt on the pool here closes no dependency cycle.
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AuditWriteFunction.Arn
      Events:
        ListTeam:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/team
            Method: get
        ChangeRole:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/team/{userSub}/role
            Method: post

  TenantProvisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-tenant-provision'
      LoggingConfig:
        LogGroup: !Ref TenantProvisionFunctionLogGroup
      CodeUri: src/handlers/
      Handler: tenant_provision.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt TenantsTable.Arn
            - Effect: Allow
              # PutParameter, not secretsmanager:CreateSecret: the deploy
              # permissions boundary grants Secrets Manager read only, so
              # CreateSecret was denied on every signup and left the user with
              # no custom:tenant_id. See common/paramstore.py.
              Action: ssm:PutParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*
            # Sets custom:tenant_id, and puts the tenant's first user in
            # TenantAdmin. Nothing else grants group membership, so without this
            # no one could ever approve remediation.
            # NOT !GetAtt UserPool.Arn. The pool names this function as its
            # PostConfirmation trigger, so a GetAtt back on the pool closes a
            # cycle through the role SAM generates for this function --
            # UserPool -> TenantProvisionFunction -> TenantProvisionFunctionRole
            # -> UserPool -- and CloudFormation rejects the whole stack before
            # creating anything. A pool id is AWS-generated, so the exact ARN
            # cannot be constructed without referencing the pool; this account
            # holds one pool for this app and the trigger can only ever be
            # invoked by it.
            - Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  # The write path for per-tenant integration credentials, which had none.
  # fn-tenant-provision creates the parameter with four empty objects and nothing
  # could ever fill them in, so on a fresh deployment both correlation stages
  # returned "no platform configured" permanently, the IMS was never notified and
  # every approval recorded execution_status "skipped".
  TenantSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-tenant-settings'
      LoggingConfig:
        LogGroup: !Ref TenantSettingsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: tenant_settings.handler
      Environment:
        Variables:
          AUDIT_WRITE_FUNCTION_NAME: !Ref AuditWriteFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/integration-creds
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AuditWriteFunction.Arn
      Events:
        ListIntegrations:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/integrations
            Method: get
        PutIntegration:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/integrations/{integration}
            Method: put
        DeleteIntegration:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/integrations/{integration}
            Method: delete

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-authorizer'
      LoggingConfig:
        LogGroup: !Ref AuthorizerFunctionLogGroup
      CodeUri: src/handlers/
      Handler: authorizer.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          # Required: the audience check against this client id is what stops a
          # token minted by any other Cognito user pool from being accepted.
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      # No IAM policy needed: the token is verified against the pool's public
      # JWKS over HTTPS, so the authorizer makes no AWS API calls on the request
      # path and cannot be throttled by Cognito.

  QueryDiagnosticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-query-diagnostics'
      LoggingConfig:
        LogGroup: !Ref QueryDiagnosticsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: query_diagnostics.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/dek
      Events:
        # These three were implemented and documented in the handler and wired to
        # nothing, so the incident list, the pipeline stage timeline and the whole
        # audit trail answered API Gateway's "Missing Authentication Token".
        ListAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/alerts
            Method: get
        GetAlertStatus:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/alerts/{alertId}/status
            Method: get
        ListAudit:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/audit
            Method: get
        GetDiagnostic:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/diagnostics/{alertId}
            Method: get
        ListRunbooks:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks
            Method: get
        GetRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}
            Method: get
        ExportRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}/export
            Method: get

  # fn-chat: the conversational read surface over an incident.
  #
  # Its policy is deliberately NOT fn-trigger-remediation's, and deliberately
  # narrower than fn-query-diagnostics': it assumes TenantScopedReadRole rather
  # than TenantScopedRole, so these credentials cannot write a row or an object
  # at all. It also cannot invoke another Lambda, publish to a topic, or read a
  # tenant's integration credentials (ssm:GetParameter is scoped to the DEK
  # path), so it has no route to a remediation endpoint. The IAM layer enforces
  # what the tool list states.
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-chat'
      LoggingConfig:
        LogGroup: !Ref ChatFunctionLogGroup
      CodeUri: src/handlers/
      Handler: chat.handler
      # Up to four model turns, each with a tool read in between. The API
      # Gateway integration gives up at 29s, so this is sized to lose to that
      # rather than to bill turns nobody is waiting for any more.
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          # Overrides the Globals value, which is the read/write role. This is
          # the whole point: common.tenant_scope assumes whatever this names, so
          # naming the read-only role here is what makes fn-chat's credentials
          # incapable of a write.
          TENANT_SCOPED_ROLE_ARN: !GetAtt TenantScopedReadRole.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedReadRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/dek
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
      Events:
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/chat
            Method: post

  TriggerRemediationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-fn-trigger-remediation'
      LoggingConfig:
        LogGroup: !Ref TriggerRemediationFunctionLogGroup
      CodeUri: src/handlers/
      Handler: trigger_remediation.handler
      Timeout: 30
      Environment:
        Variables:
          AUDIT_WRITE_FUNCTION_NAME: !Ref AuditWriteFunction
          NOTIFY_IMS_FUNCTION_NAME: !Ref NotifyImsFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/integration-creds
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/tenant/*/dek
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt AuditWriteFunction.Arn
                - !GetAtt NotifyImsFunction.Arn
      Events:
        ApproveRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}/approve
            Method: post
        # The UI has always had a Decline button with no endpoint behind it, so
        # declining was a client-side state change only and never recorded.
        DeclineRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}/decline
            Method: post

  # ---------------------------------------------------------------------
  # API Gateway - ingestion (public webhook, API key + per-tenant HMAC)
  # ---------------------------------------------------------------------
  IngestionApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${NamePrefix}-ingestion-api'
      StageName: prod
      TracingEnabled: false

  IngestionApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - IngestionApiprodStage
    Properties:
      Name: !Sub '${NamePrefix}-ingestion-api-key'
      Enabled: true
      StageKeys:
        - RestApiId: !Ref IngestionApi
          StageName: prod

  IngestionUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - IngestionApiprodStage
    Properties:
      UsagePlanName: !Sub '${NamePrefix}-ingestion-usage-plan'
      ApiStages:
        - ApiId: !Ref IngestionApi
          Stage: prod
      Throttle:
        RateLimit: 50
        BurstLimit: 100

  IngestionUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref IngestionApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref IngestionUsagePlan

  # ---------------------------------------------------------------------
  # API Gateway - tenant-facing admin API (custom Lambda REQUEST authorizer)
  # ---------------------------------------------------------------------
  AdminApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${NamePrefix}-admin-api'
      StageName: prod
      Cors:
        # The console is served from CloudFront, a different origin, so the
        # browser preflights every call. Without this the front end cannot reach
        # this API at all.
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: TenantAuthorizer
        # An OPTIONS preflight carries no Authorization header, so authorizing it
        # would fail CORS before the real request was ever sent.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          TenantAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            # REQUEST, explicitly. SAM defaults FunctionPayloadType to TOKEN, and a
            # TOKEN authorizer is invoked with {"authorizationToken": ...} and no
            # "headers" key -- so the handler saw no token on every call and the API
            # denied every authenticated request. Identity.Headers (plural) is also
            # the REQUEST spelling; under TOKEN it is silently the wrong shape.
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Authorization
              # Cache the verified result. This was 0, so the authorizer re-ran
              # on every single request.
              ReauthorizeEvery: 300
      # A 401 from the authorizer is generated by API Gateway, not by a Lambda, so
      # it carries none of the CORS headers common.response adds. Without these
      # the browser reports an opaque CORS failure instead of a 401, and the
      # console cannot tell "your session expired" from "the API is down".
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*

  # ---------------------------------------------------------------------
  # EventBridge: alert.received fans out to the diagnosis state machine
  # and to a durable buffer queue
  # ---------------------------------------------------------------------
  AlertReceivedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${NamePrefix}-rule-alert-received'
      EventPattern:
        source:
          - outagediag.ingestion
        detail-type:
          - alert.received
      Targets:
        - Id: DiagnosisPipeline
          Arn: !Ref DiagnosisPipeline
          RoleArn: !GetAtt EventBridgeStartExecutionRole.Arn
          InputPath: $.detail
          RetryPolicy:
            MaximumRetryAttempts: 3
          # Without a DLQ, an alert EventBridge cannot dispatch after its retries
          # is discarded with no record that it ever arrived.
          DeadLetterConfig:
            Arn: !GetAtt AlertDispatchDlq.Arn

  AlertDispatchDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AlertDispatchDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AlertDispatchDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AlertReceivedRule.Arn

  EventBridgeStartExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}-role-eventbridge-sfn'
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-diagnosis-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DiagnosisPipeline

  # ---------------------------------------------------------------------
  # Step Functions diagnosis pipeline
  # ---------------------------------------------------------------------
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}-role-sfn-execution'
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-pipeline-stages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt CorrelateLogsFunction.Arn
                  - !GetAtt CorrelateConfigFunction.Arn
                  - !GetAtt RagContextFunction.Arn
                  - !GetAtt GenerateRcaFunction.Arn
                  - !GetAtt GenerateRunbookFunction.Arn
                  - !GetAtt NotifyFunction.Arn
                  - !GetAtt MarkPipelineFailedFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineFailureDlq.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OpsAlarmsTopic

  DiagnosisPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${NamePrefix}-sfn-diagnosis-pipeline'
      Type: STANDARD
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: statemachine/diagnosis_pipeline.asl.json
      DefinitionSubstitutions:
        CorrelateLogsFunctionArn: !GetAtt CorrelateLogsFunction.Arn
        CorrelateConfigFunctionArn: !GetAtt CorrelateConfigFunction.Arn
        RagContextFunctionArn: !GetAtt RagContextFunction.Arn
        GenerateRcaFunctionArn: !GetAtt GenerateRcaFunction.Arn
        GenerateRunbookFunctionArn: !GetAtt GenerateRunbookFunction.Arn
        NotifyFunctionArn: !GetAtt NotifyFunction.Arn
        MarkPipelineFailedFunctionArn: !GetAtt MarkPipelineFailedFunction.Arn
        PipelineFailureDlqUrl: !Ref PipelineFailureDlq
        OpsAlarmsTopicArn: !Ref OpsAlarmsTopic

  # ---------------------------------------------------------------------
  # An execution killed by the state machine's own 300s timeout runs no Catch,
  # so the failure path never executes: nothing marked the alert failed, nothing
  # reached the DLQ and nothing published to the ops topic. A timeout is exactly
  # the case NFR-01 cares most about, so it is recorded from outside the
  # execution instead. ABORTED is included because a manual stop leaves an alert
  # in the same indefinitely-"diagnosing" state.
  # ---------------------------------------------------------------------
  ExecutionTimedOutRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${NamePrefix}-rule-execution-timed-out'
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !Ref DiagnosisPipeline
          status:
            - TIMED_OUT
            - ABORTED
      Targets:
        - Id: MarkPipelineFailed
          Arn: !GetAtt MarkPipelineFailedFunction.Arn

  ExecutionTimedOutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MarkPipelineFailedFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExecutionTimedOutRule.Arn

  # ---------------------------------------------------------------------
  # CloudWatch log groups
  #
  # One per function, declared explicitly for two reasons: Lambda's implicit
  # /aws/lambda/<name> group is not a stack resource, so it outlived every
  # teardown with never-expiring retention; and that name cannot carry the
  # required app-b9dac5ac-bc8fbf47- prefix. Each function's LoggingConfig above
  # points at its group here.
  # ---------------------------------------------------------------------

  S3VectorsSetupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-s3vectors-setup-logs'
      RetentionInDays: 14

  IngestNormalizeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-ingest-normalize-logs'
      RetentionInDays: 14

  CorrelateLogsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-correlate-logs-logs'
      RetentionInDays: 14

  CorrelateConfigFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-correlate-config-logs'
      RetentionInDays: 14

  RagContextFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-rag-context-logs'
      RetentionInDays: 14

  GenerateRcaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-generate-rca-logs'
      RetentionInDays: 14

  GenerateRunbookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-generate-runbook-logs'
      RetentionInDays: 14

  NotifyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-notify-logs'
      RetentionInDays: 14

  MarkPipelineFailedFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-mark-pipeline-failed-logs'
      RetentionInDays: 14

  TenantSettingsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-tenant-settings-logs'
      RetentionInDays: 14

  NotifyImsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-notify-ims-logs'
      RetentionInDays: 14

  AuditWriteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-audit-write-logs'
      RetentionInDays: 14

  TenantProvisionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '${NamePrefix}-fn-tenant-provision-logs'
      RetentionInDays: 14

  AuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
