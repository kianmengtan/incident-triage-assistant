  # ---------------------------------------------------------------------
  # Console hosting (S3 + CloudFront behind an Origin Access Control)
  #
  # The repo contains a front end that nothing used to deploy, so app_url
  # pointed at the admin API's root — which answers "Missing Authentication
  # Token" to a browser. This serves the console, and app_url is its CloudFront
  # domain.
  #
  # SSE-S3 deliberately: a CloudFront OAC reading an SSE-KMS bucket also needs
  # kms:Decrypt granted to the CloudFront service principal in the key's own
  # policy, and without that every request returns an opaque AccessDenied.
  # ---------------------------------------------------------------------
  ConsoleBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${NamePrefix}-console-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ConsoleOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${NamePrefix}-console-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${NamePrefix} incident triage console'
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: console-s3
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ConsoleOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: console-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # CachingOptimized (AWS managed policy)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ConsoleBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsoleDistribution}

  # ---------------------------------------------------------------------
  # CloudWatch alarms (SLA monitoring)
  # ---------------------------------------------------------------------
  RunbookSlaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-alarm-runbook-sla'
      AlarmDescription: Fires when a diagnosis pipeline execution exceeds the 5-minute runbook-delivery SLA.
      # ExecutionTime is only published when an execution FINISHES, so this
      # catches a slow pipeline. A HUNG one publishes no datapoint at all and is
      # caught by RunbookSlaTimeoutAlarm instead.
      Namespace: AWS/States
      MetricName: ExecutionTime
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref DiagnosisPipeline
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  IngestionSlaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-alarm-ingestion-sla'
      AlarmDescription: Fires when alert ingestion (webhook to 202 response) exceeds the 1-minute SLA.
      # Threshold sits well under the function's own 30s timeout. At 60000ms
      # this alarm could never fire: Lambda kills the function at 30000ms, so
      # Duration never reached the threshold and NFR-02 went unmonitored.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestNormalizeFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic


  RunbookSlaTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-alarm-runbook-sla-timeout'
      AlarmDescription: >
        Fires when a diagnosis pipeline execution is killed by the state
        machine's 300s timeout. This is the case NFR-01 most cares about and the
        ExecutionTime alarm cannot see, because a hung execution publishes no
        ExecutionTime datapoint at all.
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref DiagnosisPipeline
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  IngestionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-alarm-ingestion-errors'
      AlarmDescription: Fires when the ingestion webhook is erroring, i.e. alerts are being rejected or lost.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestNormalizeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  UndispatchedAlertsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-alarm-undispatched-alerts'
      AlarmDescription: Fires when an alert reached EventBridge but could not be handed to the diagnosis pipeline.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AlertDispatchDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  AuditWriteFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-alarm-audit-write-failures'
      AlarmDescription: Fires when an audit record could not be persisted. Anything here is a compliance gap.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AuditWriteDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

Outputs:
  # CloudFormation output names must be alphanumeric, so the contract's
  # app_url key is produced by deploy.sh from this output.
  AppUrl:
    Description: The incident triage console.
    Value: !Sub https://${ConsoleDistribution.DomainName}
  IngestionApiUrl:
    Value: !Sub https://${IngestionApi}.execute-api.${AWS::Region}.amazonaws.com/prod/v1/alerts
  AdminApiUrl:
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  IngestionApiKeyId:
    Value: !Ref IngestionApiKey
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ConsoleBucketName:
    Value: !Ref ConsoleBucket
  ConsoleDistributionId:
    Value: !Ref ConsoleDistribution
  RunbooksBucketName:
    Value: !Ref RunbooksBucket
  ContextCacheBucketName:
    Value: !Ref ContextCacheBucket
  AuditExportsBucketName:
    Value: !Ref AuditExportsBucket
  DiagnosisPipelineArn:
    Value: !Ref DiagnosisPipeline
  S3VectorsSetupTopicArn:
    Value: !Ref S3VectorsSetupTopic
