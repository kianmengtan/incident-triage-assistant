AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Incident Triage Assistant - automated outage diagnosis and remediation
  (alert ingestion -> log/config correlation -> RAG -> Bedrock RCA -> runbook
  -> gated remediation), multi-tenant, per platform contract app-b9dac5ac-bc8fbf47.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        TENANTS_TABLE: !Ref TenantsTable
        ALERTS_TABLE: !Ref AlertsTable
        DIAGNOSTICS_TABLE: !Ref DiagnosticsTable
        RUNBOOKS_TABLE: !Ref RunbooksTable
        AUDIT_TABLE: !Ref AuditTrailTable
        CONTEXT_CACHE_BUCKET: !Ref ContextCacheBucket
        RUNBOOKS_BUCKET: !Ref RunbooksBucket
        VECTOR_BUCKET: app-b9dac5ac-bc8fbf47-vectors
        VECTOR_INDEX: incidents
        RUNBOOK_READY_TOPIC_ARN: !Ref RunbookReadyTopic
        OPS_ALARMS_TOPIC_ARN: !Ref OpsAlarmsTopic
        TENANT_SCOPED_ROLE_ARN: !GetAtt TenantScopedRole.Arn

Resources:

  # ---------------------------------------------------------------------
  # Shared Lambda layer (common/ helper modules + boto3/cryptography)
  # ---------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: app-b9dac5ac-bc8fbf47-layer-common
      # src/layer/python/, NOT src/layer/. With a BuildMethod set, SAM treats
      # ContentUri as the build source and adds the layer's own `python/` prefix
      # itself -- so pointing at src/layer/ nested the repo's python/ directory
      # inside SAM's, producing /opt/python/python/common/. Only /opt/python is on
      # PYTHONPATH, so every function failed at import with "No module named
      # 'common'" (and the custom resource with "No module named 'cfnresponse'"),
      # after a build and a deploy that both reported success. requirements.txt
      # lives in the same directory because SAM looks for the manifest inside
      # ContentUri.
      ContentUri: src/layer/python/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  # ---------------------------------------------------------------------
  # DynamoDB tables
  # ---------------------------------------------------------------------
  TenantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: app-b9dac5ac-bc8fbf47-tenants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  AlertsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: app-b9dac5ac-bc8fbf47-alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: received_at
          AttributeType: N
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # The base sort key is alert#{alert_id}, which deduplicates correctly but
        # orders lexicographically by id. The incident rail needs newest-first, so
        # chronological ordering comes from here instead.
        - IndexName: received-at-index
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: received_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  DiagnosticsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: app-b9dac5ac-bc8fbf47-diagnostics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  RunbooksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: app-b9dac5ac-bc8fbf47-runbooks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  AuditTrailTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: app-b9dac5ac-bc8fbf47-audit-trail
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # S3 buckets (tenant-prefixed objects, default SSE-S3 encryption)
  # ---------------------------------------------------------------------
  ContextCacheBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub app-b9dac5ac-bc8fbf47-context-cache-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-context-cache
            Status: Enabled
            ExpirationInDays: 30

  RunbooksBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub app-b9dac5ac-bc8fbf47-runbooks-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AuditExportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub app-b9dac5ac-bc8fbf47-audit-exports-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------
  # S3 Vectors bucket + index (created via custom resource; not yet a
  # native CloudFormation resource type)
  # ---------------------------------------------------------------------
  S3VectorsSetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-s3vectors-setup
      LoggingConfig:
        LogGroup: !Ref S3VectorsSetupFunctionLogGroup
      CodeUri: src/handlers/
      Handler: s3vectors_setup.handler
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:CreateVectorBucket
                - s3vectors:GetVectorBucket
                - s3vectors:DeleteVectorBucket
                - s3vectors:CreateIndex
                - s3vectors:GetIndex
                - s3vectors:DeleteIndex
              Resource: '*'

  # S3 Vectors bucket/index creation can outlast CloudFormation's stack
  # operation timeout, so it is never invoked as a CFN custom resource.
  # Instead deploy.sh publishes to S3VectorsSetupTopic once the stack is
  # live, and S3VectorsAsyncSetupFunction runs the setup out-of-band.
  S3VectorsSetupTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-b9dac5ac-bc8fbf47-topic-s3vectors-setup

  S3VectorsAsyncSetupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-s3vectors-async-setup
      CodeUri: src/handlers/
      Handler: s3vectors_async_setup.handler
      Timeout: 300
      Environment:
        Variables:
          S3VECTORS_SETUP_FUNCTION_NAME: !Ref S3VectorsSetupFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt S3VectorsSetupFunction.Arn
      Events:
        SetupTrigger:
          Type: SNS
          Properties:
            Topic: !Ref S3VectorsSetupTopic

  # ---------------------------------------------------------------------
  # SQS buffer queue + DLQ
  # ---------------------------------------------------------------------
  # Three queues, one job each. There used to be a "buffer" queue that nothing
  # consumed — so alerts accumulated in it and expired — sharing a DLQ with
  # pipeline failures, which made that DLQ unredrivable: the two message shapes
  # are completely different and a consumer could not tell them apart.

  # Alerts EventBridge could not hand to the state machine. This is what stops a
  # failed StartExecution from silently dropping an alert.
  AlertDispatchDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: app-b9dac5ac-bc8fbf47-queue-alert-dispatch-dlq
      MessageRetentionPeriod: 1209600

  # Pipeline executions that failed part-way. Messages carry the full state so a
  # redrive can resume with the context already gathered.
  PipelineFailureDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: app-b9dac5ac-bc8fbf47-queue-pipeline-failure-dlq
      MessageRetentionPeriod: 1209600

  # Audit records that could not be written. A trail described as append-only
  # cannot lose records to a failed asynchronous invoke.
  AuditWriteDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: app-b9dac5ac-bc8fbf47-queue-audit-write-dlq
      MessageRetentionPeriod: 1209600

  # ---------------------------------------------------------------------
  # SNS topics
  # ---------------------------------------------------------------------
  RunbookReadyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-b9dac5ac-bc8fbf47-topic-runbook-ready

  OpsAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: app-b9dac5ac-bc8fbf47-topic-ops-alarms

  # ---------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    # Deleted with the stack: destroy.sh must leave nothing behind, and the
    # accounts in it are self-signup accounts for a prototype.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: app-b9dac5ac-bc8fbf47-cognito-userpool
      MfaConfiguration: 'OFF'
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: tenant_id
          AttributeDataType: String
          # Mutable so the PostConfirmation trigger can set it; deliberately
          # absent from the app client's WriteAttributes so the user cannot.
          Mutable: true
          Required: false
      LambdaConfig:
        PostConfirmation: !GetAtt TenantProvisionFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: app-b9dac5ac-bc8fbf47-app-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # custom:tenant_id is deliberately NOT writable. With self-signup
      # enabled, a client-writable tenant attribute let anyone claim an existing
      # tenant's id at signup and then read that tenant's incidents.
      # fn-tenant-provision derives it from the verified email domain instead.
      WriteAttributes:
        - email

  TenantAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TenantAdmin
      UserPoolId: !Ref UserPool

  TenantEngineerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TenantEngineer
      UserPoolId: !Ref UserPool

  TenantLeadershipGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TenantLeadership
      UserPoolId: !Ref UserPool

  UserPoolInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TenantProvisionFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------
  # Tenant-scoped data-plane role (assumed by pipeline/query Lambdas with
  # a tenant_id session tag; its own policy restricts DynamoDB LeadingKeys
  # and S3 key prefixes to that tag, enforcing IAM-level tenant isolation)
  # ---------------------------------------------------------------------
  TenantScopedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-b9dac5ac-bc8fbf47-role-tenant-scoped
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            # TagSession as well as AssumeRole: tenant_scope tags each session
            # with tenant_id, and passing session tags needs BOTH actions here
            # and in the caller's own policy. Granting only AssumeRole made
            # every data-plane call in the application fail with AccessDenied.
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/app-b9dac5ac-bc8fbf47-*
      Policies:
        - PolicyName: tenant-scoped-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TenantsTable.Arn
                  - !GetAtt AlertsTable.Arn
                  # The incident list is the one query that MUST use a GSI: the
                  # base sort key is alert#{alert_id}, so chronological order can
                  # only come from received-at-index. A Query on an index needs the
                  # index ARN, and without it the list failed with AccessDenied.
                  - !Sub ${AlertsTable.Arn}/index/*
                  - !GetAtt DiagnosticsTable.Arn
                  - !GetAtt RunbooksTable.Arn
                  - !Sub ${RunbooksTable.Arn}/index/*
                  - !GetAtt AuditTrailTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ${aws:PrincipalTag/tenant_id}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub ${ContextCacheBucket.Arn}/tenant/${!aws:PrincipalTag/tenant_id}/*
                  - !Sub ${RunbooksBucket.Arn}/tenant/${!aws:PrincipalTag/tenant_id}/*

  # ---------------------------------------------------------------------
  # Pipeline Lambda functions
  # ---------------------------------------------------------------------
  IngestNormalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-ingest-normalize
      LoggingConfig:
        LogGroup: !Ref IngestNormalizeFunctionLogGroup
      CodeUri: src/handlers/
      Handler: ingest_normalize.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-ingest-hmac-*
      Events:
        PostAlert:
          Type: Api
          Properties:
            RestApiId: !Ref IngestionApi
            Path: /v1/alerts
            Method: post
            Auth:
              ApiKeyRequired: true

  CorrelateLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-correlate-logs
      LoggingConfig:
        LogGroup: !Ref CorrelateLogsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: correlate.logs_handler
      Timeout: 90
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-integration-creds-*

  CorrelateConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-correlate-config
      LoggingConfig:
        LogGroup: !Ref CorrelateConfigFunctionLogGroup
      CodeUri: src/handlers/
      Handler: correlate.config_handler
      Timeout: 90
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-integration-creds-*

  RagContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-rag-context
      LoggingConfig:
        LogGroup: !Ref RagContextFunctionLogGroup
      CodeUri: src/handlers/
      Handler: rag_context.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/cohere.embed-multilingual-v3
            - Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:PutVectors
              Resource:
                - !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/app-b9dac5ac-bc8fbf47-vectors
                - !Sub arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/app-b9dac5ac-bc8fbf47-vectors/index/*

  GenerateRcaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-generate-rca
      LoggingConfig:
        LogGroup: !Ref GenerateRcaFunctionLogGroup
      CodeUri: src/handlers/
      Handler: generate_rca.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-dek-*
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

  GenerateRunbookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-generate-runbook
      LoggingConfig:
        LogGroup: !Ref GenerateRunbookFunctionLogGroup
      CodeUri: src/handlers/
      Handler: generate_runbook.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-notify
      LoggingConfig:
        LogGroup: !Ref NotifyFunctionLogGroup
      CodeUri: src/handlers/
      Handler: notify.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref RunbookReadyTopic
            # notify.handler calls progress.mark_stage, which writes through the
            # tenant-scoped role. Without this the call failed on every
            # invocation -- and mark_stage swallows failures by design, so the
            # last stage of the pipeline simply never appeared in the timeline
            # and nothing anywhere said why.
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn

  # Nothing used to record that a diagnosis failed. The state machine sent the
  # failed state to a DLQ and published to the ops topic, but never touched the
  # alert row -- so the read API's "failed" state was unreachable and a failed
  # diagnosis showed as "diagnosing" indefinitely.
  MarkPipelineFailedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-mark-pipeline-failed
      LoggingConfig:
        LogGroup: !Ref MarkPipelineFailedFunctionLogGroup
      CodeUri: src/handlers/
      Handler: notify.failure_handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn

  NotifyImsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-notify-ims
      LoggingConfig:
        LogGroup: !Ref NotifyImsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: notify_ims.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-integration-creds-*

  AuditWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-audit-write
      LoggingConfig:
        LogGroup: !Ref AuditWriteFunctionLogGroup
      CodeUri: src/handlers/
      Handler: audit_write.handler
      # record_audit invokes this asynchronously, so an exception here would
      # vanish after Lambda's internal retries with nowhere to land.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt AuditWriteDlq.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AuditWriteDlq.Arn

  TenantProvisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-tenant-provision
      LoggingConfig:
        LogGroup: !Ref TenantProvisionFunctionLogGroup
      CodeUri: src/handlers/
      Handler: tenant_provision.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt TenantsTable.Arn
            - Effect: Allow
              Action: secretsmanager:CreateSecret
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*
            # Sets custom:tenant_id, and puts the tenant's first user in
            # TenantAdmin. Nothing else grants group membership, so without this
            # no one could ever approve remediation.
            # NOT !GetAtt UserPool.Arn. The pool names this function as its
            # PostConfirmation trigger, so a GetAtt back on the pool closes a
            # cycle through the role SAM generates for this function --
            # UserPool -> TenantProvisionFunction -> TenantProvisionFunctionRole
            # -> UserPool -- and CloudFormation rejects the whole stack before
            # creating anything. A pool id is AWS-generated, so the exact ARN
            # cannot be constructed without referencing the pool; this account
            # holds one pool for this app and the trigger can only ever be
            # invoked by it.
            - Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  # The write path for per-tenant integration credentials, which had none.
  # fn-tenant-provision creates the secret with four empty objects and nothing
  # could ever fill them in, so on a fresh deployment both correlation stages
  # returned "no platform configured" permanently, the IMS was never notified and
  # every approval recorded execution_status "skipped".
  TenantSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-tenant-settings
      LoggingConfig:
        LogGroup: !Ref TenantSettingsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: tenant_settings.handler
      Environment:
        Variables:
          AUDIT_WRITE_FUNCTION_NAME: !Ref AuditWriteFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-integration-creds-*
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AuditWriteFunction.Arn
      Events:
        ListIntegrations:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/integrations
            Method: get
        PutIntegration:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/integrations/{integration}
            Method: put
        DeleteIntegration:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/integrations/{integration}
            Method: delete

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-authorizer
      LoggingConfig:
        LogGroup: !Ref AuthorizerFunctionLogGroup
      CodeUri: src/handlers/
      Handler: authorizer.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          # Required: the audience check against this client id is what stops a
          # token minted by any other Cognito user pool from being accepted.
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      # No IAM policy needed: the token is verified against the pool's public
      # JWKS over HTTPS, so the authorizer makes no AWS API calls on the request
      # path and cannot be throttled by Cognito.

  QueryDiagnosticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-query-diagnostics
      LoggingConfig:
        LogGroup: !Ref QueryDiagnosticsFunctionLogGroup
      CodeUri: src/handlers/
      Handler: query_diagnostics.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-dek-*
      Events:
        # These three were implemented and documented in the handler and wired to
        # nothing, so the incident list, the pipeline stage timeline and the whole
        # audit trail answered API Gateway's "Missing Authentication Token".
        ListAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/alerts
            Method: get
        GetAlertStatus:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/alerts/{alertId}/status
            Method: get
        ListAudit:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/audit
            Method: get
        GetDiagnostic:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/diagnostics/{alertId}
            Method: get
        ListRunbooks:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks
            Method: get
        GetRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}
            Method: get
        ExportRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}/export
            Method: get

  TriggerRemediationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: app-b9dac5ac-bc8fbf47-fn-trigger-remediation
      LoggingConfig:
        LogGroup: !Ref TriggerRemediationFunctionLogGroup
      CodeUri: src/handlers/
      Handler: trigger_remediation.handler
      Timeout: 30
      Environment:
        Variables:
          AUDIT_WRITE_FUNCTION_NAME: !Ref AuditWriteFunction
          NOTIFY_IMS_FUNCTION_NAME: !Ref NotifyImsFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - sts:TagSession
              Resource: !GetAtt TenantScopedRole.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-integration-creds-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:app-b9dac5ac-bc8fbf47-tenant-*-dek-*
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt AuditWriteFunction.Arn
                - !GetAtt NotifyImsFunction.Arn
      Events:
        ApproveRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}/approve
            Method: post
        # The UI has always had a Decline button with no endpoint behind it, so
        # declining was a client-side state change only and never recorded.
        DeclineRunbook:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /v1/runbooks/{runbookId}/decline
            Method: post

  # ---------------------------------------------------------------------
  # API Gateway - ingestion (public webhook, API key + per-tenant HMAC)
  # ---------------------------------------------------------------------
  IngestionApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: app-b9dac5ac-bc8fbf47-ingestion-api
      StageName: prod
      TracingEnabled: false

  IngestionApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - IngestionApiprodStage
    Properties:
      Name: app-b9dac5ac-bc8fbf47-ingestion-api-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref IngestionApi
          StageName: prod

  IngestionUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - IngestionApiprodStage
    Properties:
      UsagePlanName: app-b9dac5ac-bc8fbf47-ingestion-usage-plan
      ApiStages:
        - ApiId: !Ref IngestionApi
          Stage: prod
      Throttle:
        RateLimit: 50
        BurstLimit: 100

  IngestionUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref IngestionApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref IngestionUsagePlan

  # ---------------------------------------------------------------------
  # API Gateway - tenant-facing admin API (custom Lambda REQUEST authorizer)
  # ---------------------------------------------------------------------
  AdminApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: app-b9dac5ac-bc8fbf47-admin-api
      StageName: prod
      Cors:
        # The console is served from CloudFront, a different origin, so the
        # browser preflights every call. Without this the front end cannot reach
        # this API at all.
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: TenantAuthorizer
        # An OPTIONS preflight carries no Authorization header, so authorizing it
        # would fail CORS before the real request was ever sent.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          TenantAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
              # Cache the verified result. This was 0, so the authorizer re-ran
              # on every single request.
              ReauthorizeEvery: 300

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*

  # ---------------------------------------------------------------------
  # EventBridge: alert.received fans out to the diagnosis state machine
  # and to a durable buffer queue
  # ---------------------------------------------------------------------
  AlertReceivedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-b9dac5ac-bc8fbf47-rule-alert-received
      EventPattern:
        source:
          - outagediag.ingestion
        detail-type:
          - alert.received
      Targets:
        - Id: DiagnosisPipeline
          Arn: !Ref DiagnosisPipeline
          RoleArn: !GetAtt EventBridgeStartExecutionRole.Arn
          InputPath: $.detail
          RetryPolicy:
            MaximumRetryAttempts: 3
          # Without a DLQ, an alert EventBridge cannot dispatch after its retries
          # is discarded with no record that it ever arrived.
          DeadLetterConfig:
            Arn: !GetAtt AlertDispatchDlq.Arn

  AlertDispatchDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AlertDispatchDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AlertDispatchDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AlertReceivedRule.Arn

  EventBridgeStartExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-b9dac5ac-bc8fbf47-role-eventbridge-sfn
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-diagnosis-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DiagnosisPipeline

  # ---------------------------------------------------------------------
  # Step Functions diagnosis pipeline
  # ---------------------------------------------------------------------
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-b9dac5ac-bc8fbf47-role-sfn-execution
      PermissionsBoundary: arn:aws:iam::544635841962:policy/brd-architect-deploy-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-pipeline-stages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt CorrelateLogsFunction.Arn
                  - !GetAtt CorrelateConfigFunction.Arn
                  - !GetAtt RagContextFunction.Arn
                  - !GetAtt GenerateRcaFunction.Arn
                  - !GetAtt GenerateRunbookFunction.Arn
                  - !GetAtt NotifyFunction.Arn
                  - !GetAtt MarkPipelineFailedFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineFailureDlq.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OpsAlarmsTopic

  DiagnosisPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: app-b9dac5ac-bc8fbf47-sfn-diagnosis-pipeline
      Type: STANDARD
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: statemachine/diagnosis_pipeline.asl.json
      DefinitionSubstitutions:
        CorrelateLogsFunctionArn: !GetAtt CorrelateLogsFunction.Arn
        CorrelateConfigFunctionArn: !GetAtt CorrelateConfigFunction.Arn
        RagContextFunctionArn: !GetAtt RagContextFunction.Arn
        GenerateRcaFunctionArn: !GetAtt GenerateRcaFunction.Arn
        GenerateRunbookFunctionArn: !GetAtt GenerateRunbookFunction.Arn
        NotifyFunctionArn: !GetAtt NotifyFunction.Arn
        MarkPipelineFailedFunctionArn: !GetAtt MarkPipelineFailedFunction.Arn
        PipelineFailureDlqUrl: !Ref PipelineFailureDlq
        OpsAlarmsTopicArn: !Ref OpsAlarmsTopic

  # ---------------------------------------------------------------------
  # An execution killed by the state machine's own 300s timeout runs no Catch,
  # so the failure path never executes: nothing marked the alert failed, nothing
  # reached the DLQ and nothing published to the ops topic. A timeout is exactly
  # the case NFR-01 cares most about, so it is recorded from outside the
  # execution instead. ABORTED is included because a manual stop leaves an alert
  # in the same indefinitely-"diagnosing" state.
  # ---------------------------------------------------------------------
  ExecutionTimedOutRule:
    Type: AWS::Events::Rule
    Properties:
      Name: app-b9dac5ac-bc8fbf47-rule-execution-timed-out
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !Ref DiagnosisPipeline
          status:
            - TIMED_OUT
            - ABORTED
      Targets:
        - Id: MarkPipelineFailed
          Arn: !GetAtt MarkPipelineFailedFunction.Arn

  ExecutionTimedOutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MarkPipelineFailedFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExecutionTimedOutRule.Arn

  # ---------------------------------------------------------------------
  # CloudWatch log groups
  #
  # One per function, declared explicitly for two reasons: Lambda's implicit
  # /aws/lambda/<name> group is not a stack resource, so it outlived every
  # teardown with never-expiring retention; and that name cannot carry the
  # required app-b9dac5ac-bc8fbf47- prefix. Each function's LoggingConfig above
  # points at its group here.
  # ---------------------------------------------------------------------

  S3VectorsSetupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-s3vectors-setup-logs
      RetentionInDays: 14

  IngestNormalizeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-ingest-normalize-logs
      RetentionInDays: 14

  CorrelateLogsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-correlate-logs-logs
      RetentionInDays: 14

  CorrelateConfigFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-correlate-config-logs
      RetentionInDays: 14

  RagContextFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-rag-context-logs
      RetentionInDays: 14

  GenerateRcaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-generate-rca-logs
      RetentionInDays: 14

  GenerateRunbookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-generate-runbook-logs
      RetentionInDays: 14

  NotifyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-notify-logs
      RetentionInDays: 14

  MarkPipelineFailedFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-mark-pipeline-failed-logs
      RetentionInDays: 14

  TenantSettingsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-tenant-settings-logs
      RetentionInDays: 14

  NotifyImsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-notify-ims-logs
      RetentionInDays: 14

  AuditWriteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-audit-write-logs
      RetentionInDays: 14

  TenantProvisionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-tenant-provision-logs
      RetentionInDays: 14

  AuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-authorizer-logs
      RetentionInDays: 14

  QueryDiagnosticsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-query-diagnostics-logs
      RetentionInDays: 14

  TriggerRemediationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: app-b9dac5ac-bc8fbf47-fn-trigger-remediation-logs
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # Console hosting (S3 + CloudFront behind an Origin Access Control)
  #
  # The repo contains a front end that nothing used to deploy, so app_url
  # pointed at the admin API's root — which answers "Missing Authentication
  # Token" to a browser. This serves the console, and app_url is its CloudFront
  # domain.
  #
  # SSE-S3 deliberately: a CloudFront OAC reading an SSE-KMS bucket also needs
  # kms:Decrypt granted to the CloudFront service principal in the key's own
  # policy, and without that every request returns an opaque AccessDenied.
  # ---------------------------------------------------------------------
  ConsoleBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub app-b9dac5ac-bc8fbf47-console-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ConsoleOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: app-b9dac5ac-bc8fbf47-console-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: app-b9dac5ac-bc8fbf47 incident triage console
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: console-s3
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ConsoleOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: console-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # CachingOptimized (AWS managed policy)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ConsoleBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsoleDistribution}

  # ---------------------------------------------------------------------
  # CloudWatch alarms (SLA monitoring)
  # ---------------------------------------------------------------------
  RunbookSlaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-b9dac5ac-bc8fbf47-alarm-runbook-sla
      AlarmDescription: Fires when a diagnosis pipeline execution exceeds the 5-minute runbook-delivery SLA.
      # ExecutionTime is only published when an execution FINISHES, so this
      # catches a slow pipeline. A HUNG one publishes no datapoint at all and is
      # caught by RunbookSlaTimeoutAlarm instead.
      Namespace: AWS/States
      MetricName: ExecutionTime
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref DiagnosisPipeline
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  IngestionSlaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-b9dac5ac-bc8fbf47-alarm-ingestion-sla
      AlarmDescription: Fires when alert ingestion (webhook to 202 response) exceeds the 1-minute SLA.
      # Threshold sits well under the function's own 30s timeout. At 60000ms
      # this alarm could never fire: Lambda kills the function at 30000ms, so
      # Duration never reached the threshold and NFR-02 went unmonitored.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestNormalizeFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic


  RunbookSlaTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-b9dac5ac-bc8fbf47-alarm-runbook-sla-timeout
      AlarmDescription: >
        Fires when a diagnosis pipeline execution is killed by the state
        machine's 300s timeout. This is the case NFR-01 most cares about and the
        ExecutionTime alarm cannot see, because a hung execution publishes no
        ExecutionTime datapoint at all.
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref DiagnosisPipeline
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  IngestionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-b9dac5ac-bc8fbf47-alarm-ingestion-errors
      AlarmDescription: Fires when the ingestion webhook is erroring, i.e. alerts are being rejected or lost.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestNormalizeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  UndispatchedAlertsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-b9dac5ac-bc8fbf47-alarm-undispatched-alerts
      AlarmDescription: Fires when an alert reached EventBridge but could not be handed to the diagnosis pipeline.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AlertDispatchDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  AuditWriteFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: app-b9dac5ac-bc8fbf47-alarm-audit-write-failures
      AlarmDescription: Fires when an audit record could not be persisted. Anything here is a compliance gap.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AuditWriteDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

Outputs:
  # CloudFormation output names must be alphanumeric, so the contract's
  # app_url key is produced by deploy.sh from this output.
  AppUrl:
    Description: The incident triage console.
    Value: !Sub https://${ConsoleDistribution.DomainName}
  IngestionApiUrl:
    Value: !Sub https://${IngestionApi}.execute-api.${AWS::Region}.amazonaws.com/prod/v1/alerts
  AdminApiUrl:
    Value: !Sub https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  IngestionApiKeyId:
    Value: !Ref IngestionApiKey
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ConsoleBucketName:
    Value: !Ref ConsoleBucket
